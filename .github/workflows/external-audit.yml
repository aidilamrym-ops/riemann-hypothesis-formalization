name: external-audit

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  kernel-audit:
    name: Lean kernel rebuild + axiom sweep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan + Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache mathlib oleans
        uses: actions/cache@v4
        with:
          path: lean4/.lake
          key: mathlib-v2-${{ runner.os }}-${{ hashFiles('lean4/lake-manifest.json') }}

      - name: Verify Lean toolchain
        run: |
          lean --version
          cd lean4 && lake --version

      - name: Fetch Mathlib (real lake build; probe import exactly like validator)
        run: |
          set -o pipefail
          cd lean4
          lake update
          lake build Mathlib 2>&1 | tail -n 20
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean || {
            echo "FAIL: Mathlib.olean missing at .lake/packages/mathlib/.lake/build/lib/lean"
            find .lake -maxdepth 6 -name 'Mathlib.olean' | head -5
            exit 1
          }
          lake build AetherZ3Omega.Riemann.RhCore AetherZ3Omega.Riemann.Rigidity AetherZ3Omega.Riemann.ConreyZeroFree AetherZ3Omega.Riemann.DiracOperator AetherZ3Omega.Riemann.BarrierTheorem AetherZ3Omega.Riemann.RhZetaTower AetherZ3Omega.Riemann.RigidityInequality AetherZ3Omega.Riemann.Stage7J AetherZ3Omega.Riemann.StressTest AetherZ3Omega.Riemann.TraceFormula AetherZ3Omega.Riemann.AdditionalTheorems AetherZ3Omega.Riemann.Axioms AetherZ3Omega.Riemann.BirchSwinnertonDyer AetherZ3Omega.Riemann.ChebyshevFormal AetherZ3Omega.Riemann.CMTBounds AetherZ3Omega.Riemann.Core AetherZ3Omega.Riemann.CriticalLine AetherZ3Omega.Riemann.CriticalZeroSpacing AetherZ3Omega.Riemann.DiscreteOperator AetherZ3Omega.Riemann.DSC AetherZ3Omega.Riemann.ExplicitFormula AetherZ3Omega.Riemann.ExplicitFormulaFramework AetherZ3Omega.Riemann.ExplicitFormulaStructure AetherZ3Omega.Riemann.Goldbach AetherZ3Omega.Riemann.HardyZetaPositive AetherZ3Omega.Riemann.HodgeConjecture AetherZ3Omega.Riemann.IMV AetherZ3Omega.Riemann.KernelIndependence AetherZ3Omega.Riemann.Obstruction AetherZ3Omega.Riemann.PilarMorphism AetherZ3Omega.Riemann.PillarSynergy AetherZ3Omega.Riemann.PoincareConjecture AetherZ3Omega.Riemann.PrimeDistribution AetherZ3Omega.Riemann.PrimeDistributionBounds AetherZ3Omega.Riemann.PvsNP AetherZ3Omega.Riemann.RhProject AetherZ3Omega.Riemann.SHF AetherZ3Omega.Riemann.Stage7A AetherZ3Omega.Riemann.Stage7B AetherZ3Omega.Riemann.Stage7C AetherZ3Omega.Riemann.Stage7D AetherZ3Omega.Riemann.Stage7E AetherZ3Omega.Riemann.Stage7F AetherZ3Omega.Riemann.Stage7G AetherZ3Omega.Riemann.Stage7H AetherZ3Omega.Riemann.Stage7I AetherZ3Omega.Riemann.Stage7K AetherZ3Omega.Riemann.Stage7L AetherZ3Omega.Riemann.Stage7M AetherZ3Omega.Riemann.Stage7N AetherZ3Omega.Riemann.Stage7O AetherZ3Omega.Riemann.Stage7P AetherZ3Omega.Riemann.Stage7Phase3 AetherZ3Omega.Riemann.Stage7Phase3Strengthened AetherZ3Omega.Riemann.Stage7Q AetherZ3Omega.Riemann.Stage7R AetherZ3Omega.Riemann.Stage7S AetherZ3Omega.Riemann.Stage7T AetherZ3Omega.Riemann.Stage7U AetherZ3Omega.Riemann.Stage7V AetherZ3Omega.Riemann.YangMillsMassGap AetherZ3Omega.Riemann.ZeroSymmetry AetherZ3Omega.Riemann.ZetaAnalytic AetherZ3Omega.Riemann.ZetaBasic AetherZ3Omega.Riemann.ZetaBounds AetherZ3Omega.Riemann.ZetaFunctional 2>&1 | tail -n 25
          missing=0
          for f in AetherZ3Omega/Riemann/*.lean; do
            b=$(basename "$f" .lean)
            test -f .lake/build/lib/lean/AetherZ3Omega/Riemann/$b.olean || { echo "MISSING olean: $b"; missing=1; }
          done
          test "$missing" -eq 0 || exit 1
          echo "PROJECT BUILD OK: all $(ls lean4/AetherZ3Omega/Riemann/*.lean | wc -l) module oleans present"
          cd ..
          test -f lean4/.lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean || {
            echo "FAIL: Mathlib.olean absent at packages path"; exit 1
          }
          mkdir -p .kernel_build/sweep
          LAKE_LEAN_PATH="$(cd lean4 && lake env | sed -n 's/^LEAN_PATH=//p')"
          printf 'import Mathlib\nimport AetherZ3Omega.Riemann.RhCore\n' > lean4/_probe_import.lean
          ( cd lean4 && LEAN_PATH="$LAKE_LEAN_PATH" lean -o "$(pwd)/../.kernel_build/sweep/_probe.olean" _probe_import.lean ) || {
            echo "FAIL: probe failed using lake env LEAN_PATH (Mathlib + project sibling RhCore)"
            echo "LAKE_LEAN_PATH=$LAKE_LEAN_PATH"
            exit 1
          }
          rm -f lean4/_probe_import.lean .kernel_build/sweep/_probe.olean
          echo "PROBE OK: Mathlib + project sibling importable via lake env LEAN_PATH"

      - name: Run kernel validator (66 module sweep + #print axioms)
        run: |
          bash lean_kernel_validator.sh 2>&1 | tee /tmp/kernel_audit.log
        env:
          LEAN_EXE: lean

      - name: Assert kernel sweep complete (every module kernel-verified)
        run: |
          total=$(ls lean4/AetherZ3Omega/Riemann/*.lean | wc -l)
          pass=$(grep -c 'PASS$' .kernel_build/sweep/ledger.txt || true)
          echo "kernel sweep: $pass PASS / $total modules"
          [ "$pass" -ge "$total" ] || { echo "kernel sweep incomplete"; exit 1; }
          final=`grep -c 'depends on axioms' .kernel_build/sweep/_axioms.txt || true`
          echo "axiom sweep lines: $final"

      - name: Archive kernel audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-audit
          path: |
            .kernel_build/sweep/**
            .kernel_build/sweep/*.txt
            .kernel_build/sweep/ledger.txt
            .kernel_build/sweep/_t_*.log
            exports/_axioms_full.txt
            /tmp/kernel_audit.log

  python-audit:
    name: Defect scan + mutation + Z3 + numerics
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Ensure exports dir
        run: mkdir -p exports .kernel_build/z3_run

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install z3-solver numpy mpmath scipy

      - name: Defect scan (real sorry/admit/axiom count)
        run: python scripts/scan_defects.py

      - name: Z3 tribunal batches
        run: |
          cd z3_tribunal
          for f in z3_*.py; do
            python "$f" > "../.kernel_build/z3_run/$f.log" 2>&1 || echo "FAIL $f"
          done
          cd ..

      - name: Z3 vacuity audit
        run: python scripts/z3_vacuity_scan.py

      - name: Numeric audits (mpmath 40-digit + spectral)
        run: |
          python scripts/real_computation_audit.py
          cd scripts && python spectral_verification.py && cd ..

      - name: Kernel-independence cross-check (P5)
        run: python scripts/kernel_independence_check.py

      - name: Spectral big probe stats (P6, cached-zeros path)
        run: python scripts/spectral_big_probe.py

      - name: Archive python audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-audit
          path: |
            exports/z3_batch*.json
            exports/batch1*_report.json
            exports/batch12_scale_report.json
            exports/real_computation_audit.json
            exports/spectral_verification.json
            exports/z3_vacuity_report.json
            exports/kernel_independence_numeric.json
            exports/spectral_big_probe.json

  transpile-nexus:
    name: GRAND transpilation nexus + spectral tribunal
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Ensure exports dir
        run: mkdir -p exports exports/transpilation

      - name: Install Python deps (pyz3 for tribunal)
        run: |
          python -m pip install --upgrade pip
          pip install z3-solver

      - name: Run transpilation nexus (flagship = AST nyata, anti-cocoklogi)
        run: |
          python scripts/transpilation_nexus.py
          python scripts/transpilation_nexus.py --assert
          test -n "$(find exports/transpilation -type f | head -1)" \
            && echo "NEXUS_ARTIFACTS=OK"

      - name: Run Z3 spectral tribunal (verdict engine asli)
        run: |
          python scripts/z3_spectral_tribunal.py --assert
          python -c "import z3; print('pyz3', z3.get_version_string())"

      - name: Archive transpilation + tribunal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transpilation-nexus
          path: exports/transpilation/